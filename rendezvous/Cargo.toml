[package]
name = "rendezvous"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "rendezvous"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.51", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum-test = "21"
tokio = { version = "1.51", features = ["full"] }

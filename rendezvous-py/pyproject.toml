[project]
name = "rendezvous-py"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=43.0",
    "django>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[tool.uv]
# This is an application, not a library to be installed into site-packages.
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rendezvous.settings"

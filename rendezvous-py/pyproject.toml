[project]
name = "rendezvous-py"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "django>=6.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.uv]
# This is an application, not a library to be installed into site-packages.
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rendezvous.settings"
